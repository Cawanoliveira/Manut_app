<style>
  :root {
    --bottom-nav-height: 70px;
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-soft: #fff8f1;
    --text: #111111;
    --muted: #6b7280;
    --border: #ffd6b0;
    --primary: #ff7a00;
    --primary-strong: #f26400;
    --primary-soft: #fff1e3;
    --black-bar: #111111;
    --danger: #d62828;
    --success: #1b8f49;
    --warning: #d08a00;
    --warning-soft: #fff1cf;
    --shadow: 0 12px 26px rgba(17, 17, 17, 0.08);
    --shadow-strong: 0 16px 30px rgba(17, 17, 17, 0.14);
    --radius: 18px;
  }

  * {
    box-sizing: border-box;
    min-width: 0;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body {
    overflow-x: hidden;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  h1,
  h2,
  h3,
  p {
    margin: 0;
  }

  .connection-indicator {
    position: fixed;
    top: 8px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    z-index: 60;
    min-width: 66px;
    text-align: center;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    box-shadow: var(--shadow);
  }

  .brand-logo-template {
    display: none;
  }

  .brand-logo-inline {
    width: 142px;
    max-height: 86px;
    height: auto;
    object-fit: contain;
    flex: 0 0 auto;
    align-self: flex-start;
  }

  .connection-indicator.online {
    background: var(--success);
  }

  .connection-indicator.offline {
    background: var(--danger);
  }

  .connection-indicator.syncing {
    background: var(--warning);
    color: #111111;
  }

  .filter-fab {
    position: fixed;
    top: 40px;
    z-index: 55;
    border: 0;
    border-radius: 14px;
    background: var(--black-bar);
    color: #ffffff;
    box-shadow: var(--shadow-strong);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }

  .filter-fab-icon {
    font-size: 21px;
    line-height: 1;
  }

  .filter-fab-label {
    font-size: 14px;
    font-weight: 800;
  }

  .page-shell {
    height: calc(100vh - var(--bottom-nav-height) - env(safe-area-inset-bottom, 0px));
    padding: 8px 10px 0;
    overflow: hidden;
    background: linear-gradient(180deg, #fffdfb 0%, #ffffff 100%);
  }

  .page-section {
    display: none;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: calc(var(--bottom-nav-height) + 42px);
    scroll-padding-bottom: calc(var(--bottom-nav-height) + 42px);
  }

  .page-section.active {
    display: block;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
    padding-top: 0;
    min-height: auto;
  }

  .section-title-wrap {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    min-height: 0;
  }

  .section-title-copy {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 2px;
    min-width: 0;
    padding-top: 22px;
  }

  .section-title-copy h2,
  .section-title-copy p {
    margin: 0;
  }

  .section-header h2 {
    font-size: 25px;
    color: var(--primary-strong);
    line-height: 1.05;
  }

  .section-header p {
    margin-top: 2px;
    color: var(--muted);
    line-height: 1.35;
    font-size: 13px;
  }

  .header-actions,
  .actions-row,
  .inline-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .header-actions {
    padding-top: 22px;
  }

  .header-actions {
    align-self: center;
    margin-top: 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .section-stack {
    display: grid;
    gap: 12px;
    margin-bottom: 12px;
  }

  .panel-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .panel-title-row h3 {
    color: var(--primary-strong);
    font-size: 16px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .metric-card {
    border: 1px solid #ffd9b8;
    border-radius: 20px;
    background: linear-gradient(180deg, #ffffff 0%, #fff1e4 100%);
    padding: 14px;
    min-height: 114px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    box-shadow: 0 14px 26px rgba(242, 100, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }

  .metric-card.warning {
    background: linear-gradient(180deg, #fffaf0 0%, #ffe5b5 100%);
  }

  .metric-card.success {
    background: linear-gradient(180deg, #f8fff9 0%, #d8f4df 100%);
  }

  .metric-card.danger {
    background: linear-gradient(180deg, #fff6f5 0%, #ffd8d2 100%);
  }

  .metric-card.selected,
  .metric-card:active {
    transform: translateY(2px);
    border-color: var(--primary-strong);
    box-shadow: inset 0 4px 14px rgba(242, 100, 0, 0.18), 0 8px 16px rgba(17, 17, 17, 0.1);
  }

  .metric-card .label {
    color: var(--muted);
    font-weight: 700;
    font-size: 12px;
  }

  .metric-card .value {
    color: var(--text);
    font-size: 30px;
    font-weight: 800;
  }

  .summary-grid,
  .summary-list,
  .config-list,
  .list-cards,
  .history-list,
  .details-grid {
    display: grid;
    gap: 10px;
  }

  .summary-item,
  .history-item,
  .zoom-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    text-align: left;
  }

  .summary-item.clickable,
  .zoom-item {
    cursor: pointer;
    appearance: none;
  }

  .summary-item.clickable strong,
  .summary-item.clickable .summary-item-sub,
  .summary-item.clickable div {
    color: #ffffff;
  }

  .summary-item.selected {
    box-shadow: inset 0 0 0 2px rgba(17, 17, 17, 0.18), 0 10px 18px rgba(17, 17, 17, 0.08);
  }

  .summary-column-chart {
    position: relative;
    min-height: 240px;
    padding: 8px 0 0;
  }

  .summary-column-stage {
    position: relative;
    min-height: 220px;
    padding: 10px 2px 0 34px;
    --summary-plot-height: 132px;
    --summary-axis-base: 28px;
  }

  .summary-column-y-label {
    position: absolute;
    left: 0;
    transform: translateY(50%);
    font-size: 11px;
    font-weight: 700;
    color: #556575;
    line-height: 1;
  }

  .summary-column-grid-line {
    position: absolute;
    left: 18px;
    right: 8px;
    height: 1px;
    background: rgba(85, 101, 117, 0.18);
  }

  .summary-column-axis-y {
    position: absolute;
    left: 18px;
    top: calc(100% - var(--summary-axis-base) - var(--summary-plot-height));
    bottom: var(--summary-axis-base);
    width: 3px;
    border-radius: 999px;
    background: #556575;
  }

  .summary-column-axis-y::before {
    content: '';
    position: absolute;
    top: -8px;
    left: -5px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 10px solid #556575;
  }

  .summary-column-axis-x {
    position: absolute;
    left: 12px;
    right: 4px;
    bottom: 28px;
    height: 3px;
    border-radius: 999px;
    background: #556575;
  }

  .summary-column-axis-x::after {
    content: '';
    position: absolute;
    right: -8px;
    top: -5px;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid #556575;
  }

  .summary-column-grid {
    position: relative;
    z-index: 1;
    min-height: 210px;
    display: grid;
    gap: 4px;
    align-items: end;
  }

  .summary-column-item {
    display: grid;
    grid-template-rows: auto var(--summary-plot-height) auto;
    align-items: end;
    justify-items: center;
    gap: 4px;
    min-height: 210px;
    min-width: 0;
    padding: 0 1px;
    background: transparent;
    border: 0;
    cursor: pointer;
  }

  .summary-column-item.selected .summary-column-bar {
    box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.15);
  }

  .summary-column-value {
    font-size: 11px;
    font-weight: 800;
    color: var(--text);
  }

  .summary-column-bar-wrap {
    width: 100%;
    height: var(--summary-plot-height);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .summary-column-bar {
    width: min(28px, 100%);
    border-radius: 10px 10px 0 0;
    min-height: 10px;
  }

  .summary-column-label {
    width: 100%;
    font-size: 9px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cadastro-card {
    width: 100%;
    display: grid;
    gap: 4px;
    text-align: left;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, #ffffff 0%, #fff6ee 100%);
    box-shadow: var(--shadow);
    cursor: pointer;
  }

  .cadastro-card-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--primary-strong);
  }

  .cadastro-card-meta {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
  }

  .setor-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    line-height: 1.1;
  }

  .setor-badge-inline {
    vertical-align: middle;
  }

  .setor-badge-compact {
    padding: 7px 10px;
  }

  .summary-item strong,
  .zoom-item strong {
    font-size: 16px;
  }

  .summary-item-sub {
    font-size: 12px;
    color: rgba(17, 17, 17, 0.72);
    margin-top: 3px;
  }

  .combo-editor-item {
    align-items: center;
  }

  .combo-delete-button {
    background: #fff1f1;
    color: var(--danger);
    border: 1px solid #ffc9c9;
    font-size: 20px;
    font-weight: 800;
  }

  .filter-summary {
    padding: 10px 12px;
    margin-bottom: 10px;
    border-radius: 14px;
    background: #fff8f1;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }

  .form-grid,
  .filters-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .filter-groups {
    gap: 14px;
  }

  .filter-group {
    display: grid;
    gap: 10px;
    padding: 12px;
    border-radius: 16px;
    background: #fffaf4;
    border: 1px solid #ffe2c3;
  }

  .filter-group h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--primary-strong);
  }

  label {
    display: grid;
    gap: 6px;
    color: var(--text);
    font-weight: 700;
    font-size: 13px;
  }

  .select-manage-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
  }

  .combo-manage-button {
    min-width: 88px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field-with-action {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: start;
  }

  .field-actions-stack {
    display: grid;
    gap: 8px;
  }

  input,
  select,
  textarea {
    width: 100%;
    max-width: 100%;
    border: 1px solid #d7d7d7;
    border-radius: 14px;
    padding: 11px 12px;
    background: #fff;
    color: var(--text);
    outline: none;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.14);
  }

  textarea {
    resize: none;
  }

  small,
  .muted-text,
  .voice-commands,
  .file-picker-name {
    color: var(--muted);
    line-height: 1.4;
  }

  .voice-commands,
  .file-picker-name {
    font-size: 12px;
  }

  .voice-help-box {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    background: #fafafa;
    padding: 10px 12px;
  }

  .voice-help-box summary {
    cursor: pointer;
    font-weight: 700;
    color: var(--text);
  }

  .voice-help-box[open] .voice-commands {
    margin-top: 8px;
  }

  .full-width {
    grid-column: 1 / -1;
  }

  .primary-button,
  .secondary-button,
  .ghost-button,
  .compact-button,
  .mic-button,
  .spen-button,
  .nav-button,
  .success-button,
  .warning-button,
  .danger-button,
  .icon-button {
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .primary-button,
  .secondary-button,
  .ghost-button,
  .compact-button,
  .success-button,
  .warning-button,
  .danger-button {
    padding: 11px 13px;
  }

  .primary-button {
    background: var(--primary);
    color: #fff;
    font-weight: 800;
  }

  .secondary-button {
    background: var(--primary-soft);
    color: var(--primary-strong);
    border: 1px solid var(--border);
    font-weight: 800;
  }

  .back-button {
    min-width: 88px;
  }

  .ghost-button,
  .compact-button {
    background: #f5f5f5;
    color: var(--text);
    border: 1px solid #e5e7eb;
    font-weight: 700;
  }

  .success-button {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #b7e7c7;
    font-weight: 800;
  }

  .warning-button {
    background: var(--warning-soft);
    color: #8a5a00;
    border: 1px solid #f1d58a;
    font-weight: 800;
  }

  .danger-button {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #f3b7b7;
    font-weight: 800;
  }

  .icon-button {
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fff3f2;
    color: #991b1b;
    border: 1px solid #f3b7b7;
    font-size: 18px;
  }

  .id-button {
    background: #eef2ff;
    color: #3730a3;
    border: 1px solid #c7d2fe;
    font-weight: 800;
  }

  .mic-button,
  .spen-button {
    width: 64px;
    min-height: 48px;
    font-size: 12px;
    font-weight: 800;
  }

  .mic-button {
    background: var(--black-bar);
    color: #fff;
  }

  .mic-button.listening {
    background: #b91c1c;
    color: #ffffff;
    box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.18);
  }

  textarea.voice-preview-active {
    color: rgba(17, 24, 39, 0.46);
    background: linear-gradient(0deg, rgba(255,255,255,0.96), rgba(255,255,255,0.96)), #fff;
  }

  .spen-button {
    background: #fff1e3;
    color: var(--primary-strong);
    border: 1px solid var(--border);
  }

  .native-file-input {
    display: none;
  }

  .file-picker-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 56px;
    padding: 14px 16px;
    border-radius: 16px;
    background: linear-gradient(180deg, #fff6ee 0%, #ffe5cb 100%);
    color: var(--primary-strong);
    border: 1px solid #ffc892;
    box-shadow: 0 8px 18px rgba(242, 100, 0, 0.09);
    font-weight: 800;
    cursor: pointer;
  }

  .file-picker-icon {
    font-size: 20px;
    line-height: 1;
  }

  .inline-form input {
    flex: 1 1 220px;
  }

  .executor-inline-select {
    min-width: 100%;
    font-size: 12px;
    padding: 9px 10px;
    border-radius: 12px;
  }

  .pendencia-card {
    background: #fff;
    border: 1px solid #ececec;
    border-left: 5px solid var(--primary);
    border-radius: 18px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 10px;
  }

  .pendencia-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .pendencia-card-selected {
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18), var(--shadow);
    background: linear-gradient(180deg, #fffef9 0%, #ffffff 100%);
  }

  .selection-toolbar {
    display: grid;
    gap: 12px;
    margin-bottom: 14px;
    border-left: 5px solid var(--primary);
  }

  .selection-toolbar h3 {
    color: var(--primary-strong);
    font-size: 17px;
  }

  .table-select-head {
    display: grid;
    justify-items: center;
    gap: 4px;
  }

  .selection-toolbar-actions {
    justify-content: flex-start;
  }

  .orcamento-select-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 38px;
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid #dcdcdc;
    background: #fffaf4;
    color: var(--primary-strong);
    font-size: 12px;
    font-weight: 700;
  }

  .orcamento-select-wrap.disabled {
    opacity: 0.58;
  }

  .orcamento-select-input {
    width: 16px;
    height: 16px;
    accent-color: #f97316;
    cursor: pointer;
  }

  .orcamento-status-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    min-height: 28px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #ffd6b0;
    background: #fff1e3;
    color: var(--primary-strong);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .panel-note {
    padding: 12px 14px;
    border-radius: 14px;
    background: #fff7ef;
    border: 1px solid #ffe0be;
    color: #9a3412;
    font-size: 13px;
    line-height: 1.45;
    margin-bottom: 14px;
  }

  .orcamento-editor-block {
    display: grid;
    gap: 12px;
    margin-bottom: 16px;
  }

  .orcamento-editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .orcamento-editor-header strong {
    color: var(--primary-strong);
    font-size: 14px;
  }

  .orcamento-editor-header span {
    color: var(--muted);
    font-size: 12px;
  }

  .orcamento-itens-editor {
    display: grid;
    gap: 10px;
    max-height: min(48vh, 440px);
    overflow-y: auto;
    padding-right: 4px;
  }

  .orcamento-item-editor {
    border: 1px solid #ffe0be;
    background: #fffaf5;
    border-radius: 16px;
    padding: 12px 14px;
  }

  .orcamento-item-editor-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    align-items: start;
  }

  .orcamento-item-editor-copy {
    display: grid;
    gap: 4px;
  }

  .orcamento-item-editor-copy strong {
    color: var(--black-bar);
    font-size: 14px;
  }

  .orcamento-item-editor-copy span,
  .orcamento-item-editor-copy small {
    color: var(--muted);
    line-height: 1.45;
  }

  .orcamento-item-editor-copy small {
    font-size: 11px;
  }

  .orcamento-item-editor-value {
    display: grid;
    gap: 6px;
  }

  .orcamento-item-editor-value span {
    font-size: 11px;
    font-weight: 800;
    color: var(--primary-strong);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .orcamento-item-valor-input {
    min-height: 44px;
    text-align: right;
    font-weight: 700;
  }

  .orcamento-total-preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid #ffd7ad;
    background: linear-gradient(180deg, #fff8ef 0%, #fff2dd 100%);
  }

  .orcamento-total-preview span {
